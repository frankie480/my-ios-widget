<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Cờ báo kích thước vuông cho iOS Widget -->
    <meta name="windowSize" content="360 360" />
    <title>Widget Tổng Hợp</title>
    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.2);
            --border-glass: rgba(255, 255, 255, 0.3);
            --yellow-accent: #ffeb3b; 
            --bg-gradient: linear-gradient(135deg, rgba(56, 189, 248, 0.9), rgba(37, 99, 235, 0.9));
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent; 
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .widget-container {
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            backdrop-filter: blur(10px);
            padding: 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* KHU VỰC TRÊN CÙNG */
        .top-section {
            display: flex;
            justify-content: space-between;
        }

        .weather-main { flex: 1; }
        .greeting { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .temp-large { font-size: 44px; font-weight: 500; margin: 0; line-height: 1; display: flex; }
        .temp-large sup { font-size: 18px; margin-top: 6px; }
        .weather-desc { font-size: 12px; margin-top: 4px; color: var(--yellow-accent); font-weight: 600; text-transform: capitalize; }
        .location { font-size: 11px; margin-top: 4px; font-weight: 600; }
        .hl-temps { margin-top: 6px; }
        .hl-badge { background: var(--bg-glass); padding: 4px 8px; border-radius: 12px; font-size: 10px; border: 1px solid var(--border-glass); }

        .date-main { text-align: right; }
        .month { font-size: 13px; font-weight: bold; text-transform: uppercase; margin-bottom: -4px;}
        .date-large { font-size: 48px; font-weight: bold; line-height: 1; }
        .day-week { font-size: 12px; font-weight: 600; margin-top: 4px; }
        .lunar-badge { background: var(--bg-glass); padding: 4px 8px; border-radius: 12px; font-size: 10px; border: 1px solid var(--border-glass); margin-top: 6px; display: inline-block;}

        /* KHU VỰC GIỮA */
        .mid-section {
            display: flex;
            gap: 12px;
            flex: 1;
            margin: 12px 0;
            align-items: center;
        }

        .events-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid var(--border-glass);
            padding-right: 10px;
        }
        
        .quote-box { font-size: 12px; font-style: italic; line-height: 1.4; font-weight: 500;}

        .calendar-wrapper {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .cal-header { font-weight: bold; color: var(--text-muted); margin-bottom: 4px; font-size: 9px;}
        .cal-header.weekend { color: var(--yellow-accent); }
        
        .cal-day { 
            width: 22px; height: 22px;
            border-radius: 50%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            margin: auto; line-height: 1;
        }
        .cal-day .solar { font-size: 11px; font-weight: 600; }
        .cal-day .lunar { font-size: 7px; margin-top: 1px; color: var(--text-muted); }
        .cal-day.weekend { color: var(--yellow-accent); }
        .cal-day.weekend .lunar { color: var(--yellow-accent); opacity: 0.9; }
        .cal-day.muted { color: rgba(255, 255, 255, 0.4); }
        .cal-day.muted .lunar { opacity: 0; }
        .cal-day.active { background: #fff; color: #1e3a8a; }
        .cal-day.active .lunar { color: #1e3a8a; font-weight: bold; }

        /* KHU VỰC DƯỚI CÙNG */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-glass);
            padding-top: 8px;
        }
        
        .forecast-item { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
        .f-day { font-size: 9px; font-weight: bold; color: var(--yellow-accent); }
        .f-icon { font-size: 15px; margin: 2px 0; }
        .f-temp { font-size: 10px; font-weight: 600; }
        .f-temp .min { color: var(--text-muted); font-weight: normal; margin-left: 2px; }
    </style>
</head>
<body>
    <div class="widget-container">
        <!-- TOP SECTION -->
        <div class="top-section">
            <div class="weather-main">
                <div class="greeting">Chào buổi sáng</div>
                <div class="temp-large"><span id="cw-temp">--</span><sup>°</sup></div>
                <div class="weather-desc" id="cw-desc">Đang tải...</div>
                <div class="location">📍 Nam Định</div>
                <div class="hl-temps"><div class="hl-badge" id="cw-humid">💧 --%</div></div>
            </div>
            <div class="date-main">
                <div class="month">THÁNG <span id="current-month">--</span></div>
                <div class="date-large" id="current-date">--</div>
                <div class="day-week" id="current-day">--</div>
                <div class="lunar-badge" id="lunar-date">--/--</div>
            </div>
        </div>

        <!-- MIDDLE SECTION -->
        <div class="mid-section">
            <div class="events-list" id="events-container">
                <div class="quote-box">"Đang tải dữ liệu..."</div>
            </div>
            <div class="calendar-wrapper">
                <div class="cal-grid" id="calendar-header">
                    <div class="cal-header">T2</div><div class="cal-header">T3</div><div class="cal-header">T4</div>
                    <div class="cal-header">T5</div><div class="cal-header">T6</div><div class="cal-header weekend">T7</div>
                    <div class="cal-header weekend">CN</div>
                </div>
                <div class="cal-grid" id="calendar-days"></div>
            </div>
        </div>

        <!-- BOTTOM SECTION -->
        <div class="bottom-section" id="forecast-container"></div>
    </div>

    <script>
        const API_KEY = '12fbb774abecc2ad4fe82b28334ac8ce'; 
        const currentLat = 20.43; 
        const currentLon = 106.17;
        
        // HÀM BẮT BUỘC ĐỂ WIDGET WEB CHỜ DỮ LIỆU
        let isWeatherLoaded = false;
        function __wweb2WaitMillisecondsToWidgetIsReady() {
            return isWeatherLoaded ? 0 : 2500;
        }

        const iconMap = {
            '01d':'☀️','01n':'🌑','02d':'🌤️','02n':'☁️',
            '03d':'⛅','03n':'⛅','04d':'☁️','04n':'☁️',
            '09d':'🌧️','09n':'🌧️','10d':'🌦️','10n':'🌧️',
            '11d':'⛈️','11n':'⛈️','13d':'❄️','13n':'❄️',
            '50d':'🌫️','50n':'🌫️'
        };
        const daysVN = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];

        function initCalendar() {
            try {
                const now = new Date();
                const y = now.getFullYear(); const m = now.getMonth(); const d = now.getDate();
                
                document.getElementById('current-month').innerText = m + 1;
                document.getElementById('current-date').innerText = d;
                
                const fullDays = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
                document.getElementById('current-day').innerText = fullDays[now.getDay()];
                
                try {
                    const formatter = new Intl.DateTimeFormat('en-US-u-ca-chinese', { day: 'numeric', month: 'numeric' });
                    const parts = formatter.formatToParts(now);
                    const lDay = parts.find(p => p.type === 'day').value.padStart(2, '0');
                    const lMonth = parts.find(p => p.type === 'month').value.padStart(2, '0');
                    document.getElementById('lunar-date').innerText = lDay + '/' + lMonth + ' Âm';
                } catch (e) { document.getElementById('lunar-date').innerText = 'Âm lịch'; }

                const firstDayOfMonth = new Date(y, m, 1).getDay();
                const firstDay = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1;
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const prevDays = new Date(y, m, 0).getDate();
                
                let html = '';
                for (let i = 0; i < firstDay; i++) {
                    html += `<div class="cal-day muted"><div class="solar">${prevDays - firstDay + i + 1}</div><div class="lunar"></div></div>`;
                }
                
                for (let i = 1; i <= daysInMonth; i++) {
                    let dateObj = new Date(y, m, i);
                    let dayOfWeek = dateObj.getDay(); 
                    let isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                    let cls = "cal-day";
                    if (isWeekend) cls += " weekend";
                    if (i === d) cls += " active";
                    
                    let lunarStr = '';
                    try {
                        const f = new Intl.DateTimeFormat('en-US-u-ca-chinese', { day: 'numeric' });
                        lunarStr = f.format(dateObj);
                    } catch(e) { lunarStr = '-'; }

                    html += `<div class="${cls}"><div class="solar">${i}</div><div class="lunar">${lunarStr}</div></div>`;
                }
                document.getElementById('calendar-days').innerHTML = html;
            } catch (e) { console.log(e); }
        }

        async function fetchWeather() {
            try {
                const curRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${currentLat}&lon=${currentLon}&appid=${API_KEY}&units=metric&lang=vi`);
                const curData = await curRes.json();
                
                document.getElementById('cw-temp').innerText = Math.round(curData.main.temp);
                document.getElementById('cw-desc').innerText = curData.weather[0].description;
                document.getElementById('cw-humid').innerText = `💧 Độ ẩm: ${curData.main.humidity}%`;

                const forRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${currentLat}&lon=${currentLon}&appid=${API_KEY}&units=metric`);
                const forData = await forRes.json();

                const daily = {};
                forData.list.forEach(item => {
                    const date = item.dt_txt.split(' ')[0];
                    if (!daily[date]) {
                        daily[date] = { min: item.main.temp_min, max: item.main.temp_max, icon: item.weather[0].icon };
                    } else {
                        daily[date].min = Math.min(daily[date].min, item.main.temp_min);
                        daily[date].max = Math.max(daily[date].max, item.main.temp_max);
                        if (item.weather[0].icon.includes('d')) daily[date].icon = item.weather[0].icon;
                    }
                });

                const dates = Object.keys(daily).slice(0, 5);
                let fHtml = '';
                dates.forEach(dStr => {
                    const dData = daily[dStr];
                    const dName = daysVN[new Date(dStr).getDay()];
                    const emoji = iconMap[dData.icon] || '⛅';
                    fHtml += `
                        <div class="forecast-item">
                            <div class="f-day">${dName}</div>
                            <div class="f-icon">${emoji}</div>
                            <div class="f-temp">${Math.round(dData.max)}°<span class="min">${Math.round(dData.min)}°</span></div>
                        </div>
                    `;
                });
                document.getElementById('forecast-container').innerHTML = fHtml;
            } catch(e) {
                document.getElementById('cw-desc').innerText = "Lỗi mạng";
            } finally {
                isWeatherLoaded = true;
            }
        }

        function loadEvents() {
            const quotes = [
                "Hành trình vạn dặm bắt đầu từ một bước chân.",
                "Sự vinh quang lớn nhất không nằm ở việc không bao giờ thất bại, mà ở việc đứng dậy sau mỗi lần vấp ngã.",
                "Không có con đường dẫn đến hạnh phúc. Hạnh phúc chính là con đường."
            ];
            const q = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('events-container').innerHTML = `<div class="quote-box">"${q}"</div>`;
        }

        initCalendar();
        loadEvents();
        fetchWeather();
    </script>
</body>
</html>
