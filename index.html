<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Cập nhật viewport chuẩn cho di động, loại bỏ thẻ windowSize cũ gây lỗi tỷ lệ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="applicationTitle" content="Widget Tổng Hợp" />
    <title>Widget Tổng Hợp iOS</title>
    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --bg-glass: rgba(0, 0, 0, 0.15);
            --border-glass: rgba(255, 255, 255, 0.15);
            --red-highlight: #ff4757;
            --yellow-accent: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: transparent !important; 
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        .widget-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(28, 53, 94, 0.6), rgba(20, 38, 68, 0.6));
            backdrop-filter: blur(12px);
            /* Bỏ border-radius vì widget iOS đã tự bo góc sẵn */
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* TOP SECTION */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .weather-main {
            display: flex;
            flex-direction: column;
            width: 50%;
        }
        
        .greeting { font-size: 13px; margin-bottom: 2px; color: var(--text-muted); }
        .temp-large { 
            font-size: 46px; 
            font-weight: 300; 
            margin: 0; 
            line-height: 1; 
            display: flex; 
            align-items: flex-start; 
        }
        .temp-large sup { font-size: 20px; margin-top: 4px; }
        .weather-desc { font-size: 12px; margin-top: 4px; text-transform: capitalize; font-weight: 500;}
        .location { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; margin-top: 4px; font-weight: 600;}
        .hl-temps { margin-top: 6px; }
        .hl-badge { background: var(--bg-glass); padding: 4px 8px; border-radius: 8px; font-size: 10px; border: 1px solid var(--border-glass); display: inline-flex; }

        .date-main {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 50%;
        }
        .month { font-size: 14px; font-weight: bold; margin-bottom: -6px; text-transform: uppercase; letter-spacing: 1px;}
        .date-large { font-size: 55px; font-weight: bold; margin: 0; line-height: 1; }
        .day-week { font-size: 13px; margin-top: 2px; font-weight: 500;}
        .lunar-badge { background: var(--bg-glass); border: 1px solid var(--border-glass); padding: 3px 8px; border-radius: 8px; font-size: 10px; margin-top: 6px; }

        /* MIDDLE SECTION */
        .mid-section {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            margin-top: 15px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .events-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            padding-right: 12px;
            border-right: 1px solid var(--border-glass);
        }
        
        .event-item { position: relative; padding-left: 10px; }
        .event-item::before { content: ''; position: absolute; left: 0; top: 5px; width: 4px; height: 4px; background: var(--yellow-accent); border-radius: 50%; }
        .event-title { font-weight: bold; font-size: 12px; margin: 0; color: #ffffff;}
        .event-time { font-size: 10px; color: var(--text-muted); margin: 2px 0; font-style: italic; }
        .event-tag { font-size: 10px; color: #ffffff; font-weight: 600; }

        .quote-box { font-size: 11px; line-height: 1.4; font-style: italic; text-align: left; color: var(--text-muted);}
        .quote-author { font-size: 9px; color: var(--text-muted); font-weight: bold; text-align: right; margin-top: 4px; text-transform: uppercase; }

        .calendar-wrapper {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .cal-header { font-weight: bold; color: var(--text-muted); margin-bottom: 4px; font-size: 10px;}
        .cal-header.weekend { color: var(--red-highlight); }
        
        .cal-day { 
            width: 26px; 
            height: 26px; 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            margin: auto;
            line-height: 1;
        }
        .cal-day .solar { font-size: 11px; font-weight: 600; }
        .cal-day .lunar { font-size: 7px; margin-top: 1px; color: var(--text-muted); }

        .cal-day.weekend { color: var(--red-highlight); }
        .cal-day.weekend .lunar { color: var(--red-highlight); opacity: 0.8; }
        .cal-day.muted { color: rgba(255, 255, 255, 0.2); }
        .cal-day.muted .lunar { color: rgba(255, 255, 255, 0.15); }
        .cal-day.active { background: var(--red-highlight); color: #ffffff; }
        .cal-day.active .lunar { color: rgba(255, 255, 255, 0.9); }

        /* BOTTOM SECTION */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-glass);
            padding-top: 10px;
        }
        
        .forecast-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            flex: 1;
        }
        .f-day { font-size: 9px; font-weight: bold; color: var(--yellow-accent); text-transform: uppercase;}
        .f-icon { font-size: 14px; }
        .f-temp { font-size: 9px; display: flex; flex-direction: column; gap: 1px;}
        .f-temp span { color: var(--text-main); font-weight: 500;}
        .f-temp span.min-t { color: var(--text-muted); }

    </style>
</head>

        function getLocalISODate(date) {
            const offset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - offset).toISOString().split('T')[0];
        }

        }

                const curRes = await fetch(curUrl); 
                const curData = await curRes.json();

                document.getElementById('cw-temp').textContent = Math.round(curData.main.temp);

                const forRes = await fetch(forUrl); 
                const forData = await forRes.json();

                const dailyData = {};
                forData.list.forEach(item => {
                    const date = item.dt_txt.split(' ')[0];
                    if (!dailyData[date]) {
                        dailyData[date] = { min: item.main.temp_min, max: item.main.temp_max, icon: item.weather[0].icon };
                    } else {
                        dailyData[date].min = Math.min(dailyData[date].min, item.main.temp_min);
                        dailyData[date].max = Math.max(dailyData[date].max, item.main.temp_max);
                        if (item.weather[0].icon.includes('d')) dailyData[date].icon = item.weather[0].icon;
                    }
                });

                const container = document.getElementById('forecast-container'); 
                container.innerHTML = '';
                const availableDates = Object.keys(dailyData).slice(0, 5); 

                for (let i = 0; i < availableDates.length; i++) {
                    const tDate = availableDates[i];
                    const dayData = dailyData[tDate];
                    const dayName = daysVNArr[new Date(tDate).getDay()];
                    const emoji = iconMap[dayData.icon] || '⛅';
                    
                    container.innerHTML += `
                        <div class="forecast-item">
                            <div class="f-day">${dayName}</div>
                            <div class="f-icon">${emoji}</div>
                            <div class="f-temp">
                                <span>${Math.round(dayData.max)}°</span>
                                <span class="min-t">${Math.round(dayData.min)}°</span>
                            </div>
                        </div>`;
                }
            } catch(e) { 
                document.getElementById('cw-desc').textContent = "Lỗi kết nối"; 
            } finally {
                isWeatherLoaded = true;
            }
        }

                <div class="date-large" id="current-date">--</div>
                <div class="day-week" id="current-day">--</div>
                <div class="lunar-badge" id="lunar-date">Đang tải...</div>
            </div>
        </div>

        <!-- MIDDLE SECTION -->
        <div class="mid-section">
            <div class="events-list" id="events-container"></div>
            
            <div class="calendar-wrapper">
                <div class="cal-grid" id="calendar-header">
                    <div class="cal-header">T2</div><div class="cal-header">T3</div>
                    <div class="cal-header">T4</div><div class="cal-header">T5</div>
                    <div class="cal-header">T6</div><div class="cal-header weekend">T7</div>
                    <div class="cal-header weekend">CN</div>
                </div>
                <div class="cal-grid" id="calendar-days"></div>
            </div>
        </div>

        <!-- BOTTOM SECTION -->
        <div class="bottom-section" id="forecast-container"></div>
    </div>

    <script>
        const API_KEY = '12fbb774abecc2ad4fe82b28334ac8ce'; 
        let currentLat = 20.43; let currentLon = 106.17;

        const iconMap = {
            '01d': '☀️', '01n': '🌑', '02d': '🌤️', '02n': '☁️',
            '03d': '⛅', '03n': '⛅', '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️', '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️', '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        const daysVNArr = ["CN", "THỨ 2", "THỨ 3", "THỨ 4", "THỨ 5", "THỨ 6", "THỨ 7"];

        const famousQuotes = [
            { text: "Hành trình vạn dặm bắt đầu từ một bước chân.", author: "- LÃO TỬ" },
            { text: "Biết người biết ta, trăm trận không nguy.", author: "- TÔN VŨ" },
            { text: "Sự vinh quang lớn nhất không nằm ở việc không bao giờ thất bại, mà ở việc đứng dậy sau mỗi lần vấp ngã.", author: "- KHỔNG TỬ" },
            { text: "Không có con đường dẫn đến hạnh phúc. Hạnh phúc chính là con đường.", author: "- THÍCH NHẤT HẠNH" },
            { text: "Tôi tư duy, nên tôi tồn tại.", author: "- RENÉ DESCARTES" }
        ];

        function getLocalISODate(date) {
            const offset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - offset).toISOString().split('T')[0];
        }

        function formatEventDate(dateStr) {
            const parts = dateStr.split('-');
            return `${parts[2]}/${parts[1]}`;
        }

        async function fetchWeather() {
            try {
                const curUrl = `[https://api.openweathermap.org/data/2.5/weather?lat=$](https://api.openweathermap.org/data/2.5/weather?lat=$){currentLat}&lon=${currentLon}&appid=${API_KEY}&units=metric&lang=vi`;
                const curRes = await fetch(curUrl); 
                const curData = await curRes.json();

                document.getElementById('cw-temp').textContent = Math.round(curData.main.temp);
                document.getElementById('cw-desc').textContent = curData.weather[0].description;
                document.getElementById('cw-humid').textContent = `💧 Độ ẩm: ${curData.main.humidity}%`;

                const forUrl = `[https://api.openweathermap.org/data/2.5/forecast?lat=$](https://api.openweathermap.org/data/2.5/forecast?lat=$){currentLat}&lon=${currentLon}&appid=${API_KEY}&units=metric`;
                const forRes = await fetch(forUrl); 
                const forData = await forRes.json();

                const dailyData = {};
                forData.list.forEach(item => {
                    const date = item.dt_txt.split(' ')[0];
                    if (!dailyData[date]) {
                        dailyData[date] = { 
                            min: item.main.temp_min, max: item.main.temp_max, 
                            icon: item.weather[0].icon
                        };
                    } else {
                        dailyData[date].min = Math.min(dailyData[date].min, item.main.temp_min);
                        dailyData[date].max = Math.max(dailyData[date].max, item.main.temp_max);
                        
                        if (item.weather[0].icon.includes('d')) {
                            dailyData[date].icon = item.weather[0].icon;
                        }
                    }
                });

                const container = document.getElementById('forecast-container'); 
                container.innerHTML = '';
                
                const availableDates = Object.keys(dailyData).slice(0, 5); 

                for (let i = 0; i < availableDates.length; i++) {
                    const targetDateStr = availableDates[i];
                    const dayData = dailyData[targetDateStr];
                    
                    const targetDateObj = new Date(targetDateStr);
                    const dayName = daysVNArr[targetDateObj.getDay()];
                    const emoji = iconMap[dayData.icon] || '⛅';
                    
                    container.innerHTML += `
                        <div class="forecast-item">
                            <div class="f-day">${dayName}</div>
                            <div class="f-icon">${emoji}</div>
                            <div class="f-temp">
                                <span>↓ ${Math.round(dayData.min)}°</span>
                                <span>↑ ${Math.round(dayData.max)}°</span>
                            </div>
                        </div>
                    `;
                }
            } catch(e) { document.getElementById('cw-desc').textContent = "Lỗi tải dữ liệu"; }
        }

        function toggleEdit() {
            const form = document.getElementById('edit-form');
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
            if(form.style.display === 'block') document.getElementById('loc-input').focus();
        }

        async function changeLocation() {
            const query = document.getElementById('loc-input').value; if(!query) return;
            document.getElementById('btn-save').textContent = '...';

            try {
                const geoUrl = `[https://api.openweathermap.org/geo/1.0/direct?q=$](https://api.openweathermap.org/geo/1.0/direct?q=$){encodeURIComponent(query)}&limit=1&appid=${API_KEY}`;
                const geoRes = await fetch(geoUrl); const geoData = await geoRes.json();
                
                if(geoData && geoData.length > 0) {
                    const loc = geoData[0]; currentLat = loc.lat; currentLon = loc.lon;
                    document.getElementById('loc-name').textContent = loc.name;
                    fetchWeather();
                } else { alert("Không tìm thấy thành phố!"); }
            } catch(e) { alert("Lỗi tìm kiếm!"); }
            
            document.getElementById('btn-save').textContent = 'Tìm'; toggleEdit();
        }

        async function fetchHolidays() {
            const container = document.getElementById('events-container');
            try {
                const now = new Date();
                const year = now.getFullYear();
                const res = await fetch(`[https://date.nager.at/api/v3/PublicHolidays/$](https://date.nager.at/api/v3/PublicHolidays/$){year}/VN`);
                const publicHolidays = await res.json();

                const extraEvents = [
                    { date: `${year}-03-08`, localName: "Quốc tế Phụ nữ", type: "Kỷ niệm" },
                    { date: `${year}-03-26`, localName: "Ngày Thành lập Đoàn", type: "Kỷ niệm" },
                    { date: `${year}-09-25`, localName: "Tết Trung thu", type: "Lễ truyền thống" },
                    { date: `${year}-10-20`, localName: "Ngày Phụ nữ VN", type: "Kỷ niệm" },
                    { date: `${year}-11-20`, localName: "Ngày Nhà giáo VN", type: "Kỷ niệm" },
                    { date: `${year}-12-22`, localName: "Ngày QĐND VN", type: "Kỷ niệm" }
                ];

                let allEvents = publicHolidays.map(h => ({ date: h.date, localName: h.localName, type: "Quốc lễ" }));
                extraEvents.forEach(e => { if (!allEvents.some(item => item.date === e.date)) allEvents.push(e); });

                const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
                const startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - dayOfWeek + 1);
                const startStr = getLocalISODate(startOfWeek);
                
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                const endStr = getLocalISODate(endOfWeek);

                const weekEvents = allEvents.filter(e => e.date >= startStr && e.date <= endStr);
                container.innerHTML = '';
                
                if (weekEvents.length === 0) {
                    const randomQuote = famousQuotes[Math.floor(Math.random() * famousQuotes.length)];
                    container.innerHTML = `
                        <div class="quote-box">"${randomQuote.text}"</div>
                        <div class="quote-author">${randomQuote.author}</div>
                    `;
                } else {
                    weekEvents.slice(0, 2).forEach(ev => { 
                        container.innerHTML += `
                            <div class="event-item">
                                <p class="event-title">${ev.localName}</p>
                                <p class="event-time">Ngày ${formatEventDate(ev.date)}</p>
                                <p class="event-tag">${ev.type}</p>
                            </div>
                        `;
                    });
                }
            } catch (e) {
                const randomQuote = famousQuotes[0];
                container.innerHTML = `
                    <div class="quote-box">"${randomQuote.text}"</div>
                    <div class="quote-author">${randomQuote.author}</div>
                `;
            }
        }

        function getLunarDateString(date) {
            try {
                const formatter = new Intl.DateTimeFormat('en-US-u-ca-chinese', { day: 'numeric', month: 'numeric' });
                const parts = formatter.formatToParts(date);
                const lDay = parts.find(p => p.type === 'day').value.padStart(2, '0');
                const lMonth = parts.find(p => p.type === 'month').value.padStart(2, '0');
                
                const y = date.getFullYear();
                const can = ["Canh", "Tân", "Nhâm", "Quý", "Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ"];
                const chi = ["Thân", "Dậu", "Tuất", "Hợi", "Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi"];
                const canChi = can[y % 10] + " " + chi[y % 12];
                
                return `${lDay}/${lMonth} ${canChi}`;
            } catch (e) { return "Âm lịch VN"; }
        }

        function getLunarDayMonth(date) {
            try {
                const formatter = new Intl.DateTimeFormat('en-US-u-ca-chinese', { day: 'numeric', month: 'numeric' });
                const parts = formatter.formatToParts(date);
                const lDay = parts.find(p => p.type === 'day').value;
                const lMonth = parts.find(p => p.type === 'month').value;
                return lDay === '1' ? `${lDay}/${lMonth}` : lDay;
            } catch (e) {
                return "";
            }
        }

        function initCalendar() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDate = now.getDate();
            
            const daysVnFull = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
            document.getElementById('current-month').innerText = currentMonth + 1;
            document.getElementById('current-date').innerText = currentDate;
            document.getElementById('current-day').innerText = daysVnFull[now.getDay()];
            document.getElementById('lunar-date').innerText = getLunarDateString(now);
            
            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
            const firstDay = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1;
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();
            
            const calDaysContainer = document.getElementById('calendar-days');
            calDaysContainer.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                let d = daysInPrevMonth - firstDay + i + 1;
                let dateObj = new Date(currentYear, currentMonth - 1, d);
                let lunarStr = getLunarDayMonth(dateObj);
                calDaysContainer.innerHTML += `
                    <div class="cal-day muted">
                        <div class="solar">${d}</div>
                        <div class="lunar">${lunarStr}</div>
                    </div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                let dateObj = new Date(currentYear, currentMonth, i);
                let dayOfWeek = dateObj.getDay(); 
                let isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                
                let className = "cal-day";
                if (isWeekend) className += " weekend"; 
                if (i === currentDate) className += " active"; 
                
                let lunarStr = getLunarDayMonth(dateObj);
                
                calDaysContainer.innerHTML += `
                    <div class="${className}">
                        <div class="solar">${i}</div>
                        <div class="lunar">${lunarStr}</div>
                    </div>`;
            }
        }

        initCalendar();
        fetchHolidays();
        fetchWeather();
        setInterval(fetchWeather, 3600000);
    </script>
</body>
</html>
