<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="applicationTitle" content="Widget Tổng Hợp 2" />
    <meta name="windowSize" content="450 550" /> 
    <meta name="windowLocation" content="100 100" />
    <meta name="topMost" content="false" />
    <title>Widget Tổng Hợp</title>
    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --bg-glass: rgba(0, 0, 0, 0.15);
            --border-glass: rgba(255, 255, 255, 0.15);
            --red-highlight: #ff4757;
            --yellow-accent: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent !important; 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        .widget-container {
            width: 100%;
            height: 100%;
            /* Tăng độ trong suốt (giảm alpha xuống 0.5) */
            background: linear-gradient(to bottom, rgba(28, 53, 94, 0.8), rgba(20, 38, 68, 0.8));
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* TOP SECTION */
        .top-section {
            display: flex;
            justify-content: space-between;
        }

        .weather-main {
            display: flex;
            flex-direction: column;
            min-width: 180px;
        }
        
        .greeting { font-size: 16px; margin-bottom: 5px; }
        .temp-large { 
            font-size: 70px; 
            font-weight: 300; 
            margin: 0; 
            line-height: 1; 
            display: flex; 
            align-items: flex-start; 
        }
        .temp-large sup { font-size: 30px; margin-top: 5px; }
        .weather-desc { font-size: 14px; margin-top: 5px; text-transform: capitalize; }
        
        .location { font-size: 12px; color: var(--text-main); display: flex; align-items: center; gap: 5px; margin-top: 5px; cursor: pointer; font-weight: bold;}
        .location:hover { text-decoration: underline; }
        
        #edit-form { display: none; margin-top: 8px; }
        #loc-input { width: 120px; padding: 5px; border-radius: 4px; border: none; outline: none; font-size: 12px; color: #000; }
        #btn-save { padding: 5px 10px; border: none; border-radius: 4px; background: #3b82f6; color: white; cursor: pointer; font-size: 12px; }

        .hl-temps { display: flex; gap: 10px; margin-top: 10px; }
        .hl-badge { background: var(--bg-glass); padding: 4px 10px; border-radius: 12px; font-size: 12px; border: 1px solid var(--border-glass); display: flex; align-items: center; gap: 4px;}

        .date-main {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .month { font-size: 20px; font-weight: 600; margin-bottom: -15px; text-transform: uppercase; }
        .date-large { font-size: 90px; font-weight: bold; margin: 0; line-height: 1; }
        .day-week { font-size: 20px; margin-top: 5px; }
        .lunar-badge { background: var(--bg-glass); border: 1px solid var(--border-glass); padding: 4px 12px; border-radius: 15px; font-size: 13px; margin-top: 5px; }

        /* MIDDLE SECTION */
        .mid-section {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .events-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            padding-right: 15px;
            border-right: 1px solid var(--border-glass);
            overflow: hidden; 
        }
        
        .event-item { position: relative; padding-left: 15px; }
        .event-item::before { content: ''; position: absolute; left: 0; top: 6px; width: 6px; height: 6px; background: #ffffff; border-radius: 50%; }
        .event-title { font-weight: bold; font-size: 14px; margin: 0; color: #ffffff;}
        .event-time { font-size: 12px; color: var(--text-muted); margin: 2px 0; font-style: italic; }
        .event-tag { font-size: 12px; color: #ffffff; font-weight: 600; }

        .quote-box { font-size: 13px; line-height: 1.4; font-style: italic; text-align: left; }
        .quote-author { font-size: 11px; color: var(--text-muted); font-weight: bold; text-align: right; margin-top: 6px; text-transform: uppercase; }

        .calendar-wrapper {
            flex: 1;
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            font-size: 13px;
        }
        .cal-header { font-weight: bold; color: var(--text-muted); margin-bottom: 5px;}
        .cal-header.weekend { color: var(--red-highlight); }
        
        .cal-day { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            margin: auto;
            box-sizing: border-box;
            line-height: 1.1;
        }
        .cal-day .solar { font-size: 13px; font-weight: 500; }
        .cal-day .lunar { font-size: 9px; margin-top: 2px; color: var(--text-muted); }

        .cal-day.weekend { color: var(--red-highlight); }
        .cal-day.weekend .lunar { color: var(--red-highlight); opacity: 0.8; }
        
        .cal-day.muted { color: rgba(255, 255, 255, 0.3); }
        .cal-day.muted .lunar { color: rgba(255, 255, 255, 0.2); }
        
        .cal-day.active { background: var(--red-highlight); color: #ffffff; font-weight: bold; }
        .cal-day.active .lunar { color: rgba(255, 255, 255, 0.9); }

        /* BOTTOM SECTION */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-glass);
            padding-top: 15px;
            gap: 2px;
        }
        
        .forecast-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 0;
        }
        .f-day { font-size: 11px; font-weight: 600; color: var(--yellow-accent); text-transform: uppercase; white-space: nowrap;}
        .f-icon { font-size: 18px; }
        .f-temp { font-size: 11px; display: flex; flex-direction: column; gap: 2px;}
        .f-temp span { color: var(--text-muted); }

    </style>
</head>
<body>

    <div class="widget-container">
        <!-- TOP SECTION -->
        <div class="top-section">
            <div class="weather-main">
                <div class="greeting">Chào buổi sáng</div>
                <div class="temp-large"><span id="cw-temp">--</span><sup>°</sup></div>
                <div class="weather-desc" id="cw-desc">Đang tải...</div>
                
                <div class="location" id="loc-display" onclick="toggleEdit()">
                    📍 <span id="loc-name">Nam Định</span> ✏️
                </div>
                <div id="edit-form">
                    <input type="text" id="loc-input" placeholder="Nhập thành phố..." />
                    <button id="btn-save" onclick="changeLocation()">Tìm</button>
                </div>

                <div class="hl-temps">
                    <div class="hl-badge" id="cw-humid">💧 --%</div>
                </div>
            </div>
            
            <div class="date-main">
                <div class="month">THÁNG <span id="current-month">--</span></div>
                <div class="date-large" id="current-date">--</div>
                <div class="day-week" id="current-day">--</div>
                <div class="lunar-badge" id="lunar-date">Đang tải...</div>
            </div>
        </div>

        <!-- MIDDLE SECTION -->
        <div class="mid-section">
            <div class="events-list" id="events-container"></div>
            
            <div class="calendar-wrapper">
                <div class="cal-grid" id="calendar-header">
                    <div class="cal-header">T2</div><div class="cal-header">T3</div>
                    <div class="cal-header">T4</div><div class="cal-header">T5</div>
                    <div class="cal-header">T6</div><div class="cal-header weekend">T7</div>
                    <div class="cal-header weekend">CN</div>
                </div>
                <div class="cal-grid" id="calendar-days"></div>
            </div>
        </div>

        <!-- BOTTOM SECTION -->
        <div class="bottom-section" id="forecast-container"></div>
    </div>

    <script>
    const API_KEY = '12fbb774abecc2ad4fe82b28334ac8ce'; 
    // GÁN CỨNG TỌA ĐỘ VỊ TRÍ CỦA BẠN TẠI ĐÂY (Vd: Nam Định)
    let currentLat = 20.43; 
    let currentLon = 106.17;

    // Biến cờ đánh dấu API đã tải xong chưa
    let isWeatherLoaded = false;
    let isHolidaysLoaded = false;

    // HÀM BẮT BUỘC CỦA JSWIDGET: Báo cho iOS biết khi nào vẽ widget
    function __wweb2WaitMillisecondsToWidgetIsReady(currentDelayMs) {
        if (isWeatherLoaded && isHolidaysLoaded) {
            return 0; // Đã tải xong dữ liệu, báo iOS chụp màn hình ngay
        }
        return 1000; // Chưa xong, xin thêm 1 giây (tối đa iOS cho 30s)
    }

    const iconMap = {
        '01d': '☀️', '01n': '🌑', '02d': '🌤️', '02n': '☁️',
        '03d': '⛅', '03n': '⛅', '04d': '☁️', '04n': '☁️',
        '09d': '🌧️', '09n': '🌧️', '10d': '🌦️', '10n': '🌧️',
        '11d': '⛈️', '11n': '⛈️', '13d': '❄️', '13n': '❄️',
        '50d': '🌫️', '50n': '🌫️'
    };

    const daysVNArr = ["CN", "THỨ 2", "THỨ 3", "THỨ 4", "THỨ 5", "THỨ 6", "THỨ 7"];

    const famousQuotes = [
        { text: "Hành trình vạn dặm bắt đầu từ một bước chân.", author: "- LÃO TỬ" },
        { text: "Nơi nào có ý chí, nơi đó có con đường.", author: "- TỤC NGỮ" }
    ];

    function getLocalISODate(date) {
        const offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().split('T')[0];
    }

    function formatEventDate(dateStr) {
        const parts = dateStr.split('-');
        return `${parts[2]}/${parts[1]}`;
    }

    async function fetchWeather() {
        try {
            const curUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${currentLat}&lon=${currentLon}&appid=${API_KEY}&units=metric&lang=vi`;
            const curRes = await fetch(curUrl); 
            const curData = await curRes.json();

            document.getElementById('cw-temp').textContent = Math.round(curData.main.temp);
            document.getElementById('cw-desc').textContent = curData.weather[0].description;
            document.getElementById('cw-humid').textContent = `💧 Độ ẩm: ${curData.main.humidity}%`;
            // Cập nhật tên thành phố tự động từ tọa độ
            document.getElementById('loc-name').textContent = curData.name || "Vị trí của bạn";

            const forUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${currentLat}&lon=${currentLon}&appid=${API_KEY}&units=metric`;
            const forRes = await fetch(forUrl); 
            const forData = await forRes.json();

            const dailyData = {};
            forData.list.forEach(item => {
                const date = item.dt_txt.split(' ')[0];
                if (!dailyData[date]) {
                    dailyData[date] = { 
                        min: item.main.temp_min, max: item.main.temp_max, 
                        icon: item.weather[0].icon
                    };
                } else {
                    dailyData[date].min = Math.min(dailyData[date].min, item.main.temp_min);
                    dailyData[date].max = Math.max(dailyData[date].max, item.main.temp_max);
                    if (item.weather[0].icon.includes('d')) {
                        dailyData[date].icon = item.weather[0].icon;
                    }
                }
            });

            const container = document.getElementById('forecast-container'); 
            container.innerHTML = '';
            const availableDates = Object.keys(dailyData).slice(0, 5); 

            for (let i = 0; i < availableDates.length; i++) {
                const targetDateStr = availableDates[i];
                const dayData = dailyData[targetDateStr];
                const targetDateObj = new Date(targetDateStr);
                const dayName = daysVNArr[targetDateObj.getDay()];
                const emoji = iconMap[dayData.icon] || '⛅';
                
                container.innerHTML += `
                    <div class="forecast-item">
                        <div class="f-day">${dayName}</div>
                        <div class="f-icon">${emoji}</div>
                        <div class="f-temp">
                            <span>↓ ${Math.round(dayData.min)}°</span>
                            <span>↑ ${Math.round(dayData.max)}°</span>
                        </div>
                    </div>
                `;
            }
        } catch(e) { 
            document.getElementById('cw-desc').textContent = "Lỗi tải dữ liệu"; 
        } finally {
            isWeatherLoaded = true; // Đánh dấu hoàn thành
        }
    }

    async function fetchHolidays() {
        const container = document.getElementById('events-container');
        try {
            const now = new Date();
            const year = now.getFullYear();
            const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/VN`);
            const publicHolidays = await res.json();

            const extraEvents = [
                { date: `${year}-03-08`, localName: "Quốc tế Phụ nữ", type: "Kỷ niệm" },
                { date: `${year}-11-20`, localName: "Ngày Nhà giáo VN", type: "Kỷ niệm" }
            ];

            let allEvents = publicHolidays.map(h => ({ date: h.date, localName: h.localName, type: "Quốc lễ" }));
            extraEvents.forEach(e => { if (!allEvents.some(item => item.date === e.date)) allEvents.push(e); });

            const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - dayOfWeek + 1);
            const startStr = getLocalISODate(startOfWeek);
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            const endStr = getLocalISODate(endOfWeek);

            const weekEvents = allEvents.filter(e => e.date >= startStr && e.date <= endStr);
            container.innerHTML = '';
            
            if (weekEvents.length === 0) {
                const randomQuote = famousQuotes[Math.floor(Math.random() * famousQuotes.length)];
                container.innerHTML = `
                    <div class="quote-box">"${randomQuote.text}"</div>
                    <div class="quote-author">${randomQuote.author}</div>
                `;
            } else {
                weekEvents.slice(0, 2).forEach(ev => { 
                    container.innerHTML += `
                        <div class="event-item">
                            <p class="event-title">${ev.localName}</p>
                            <p class="event-time">Ngày ${formatEventDate(ev.date)}</p>
                            <p class="event-tag">${ev.type}</p>
                        </div>
                    `;
                });
            }
        } catch (e) {
            const randomQuote = famousQuotes[0];
            container.innerHTML = `
                <div class="quote-box">"${randomQuote.text}"</div>
                <div class="quote-author">${randomQuote.author}</div>
            `;
        } finally {
            isHolidaysLoaded = true; // Đánh dấu hoàn thành
        }
    }

    // (Giữ nguyên các hàm lịch âm getLunarDateString, getLunarDayMonth, initCalendar như cũ)
    
    // Bỏ hàm toggleEdit() và changeLocation() đi vì không còn dùng form

    initCalendar();
    fetchHolidays();
    fetchWeather();
</script>
</body>
</html>
